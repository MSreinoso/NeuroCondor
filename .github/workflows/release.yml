name: Crear versión descargable

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release
      - run: flutter build web --release --base-href /neuro-condor/

      - name: Preparar archivos
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk NeuroCondor-Android.apk
          cd build/web
          zip -r ../../NeuroCondor-Web-iPhone.zip .

      - name: Publicar versión
        uses: softprops/action-gh-release@v2
        with:
          name: Neuro Cóndor ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            NeuroCondor-Android.apk
            NeuroCondor-Web-iPhone.zip
